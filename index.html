一天。每次旅行到最後一天都會覺得怎麼這麼快。先吃最後一頓早餐，接著我們今天會依照各自的班機安排回程。」", "shots": ["收行李、關房門", "海鮮早餐完整一輪", "分組前的合照／道別", "滯留組可拍太宰府：參道、鳥居、御本殿周邊", "最後採買、行李秤重", "機場航班看板", "登機、飛機窗外", "高雄落地或最後一段回程畫面"], "closing": "「九州 9 天 8 夜結束。如果要選最喜歡的一天，我會選＿＿＿；最好吃的是＿＿＿；最意外的是＿＿＿。也許過幾年很多細節會忘記，但至少打開這支影片，我們還能再一起走一次。九州，下次見。」", "reminder": "除了景點本身，也記得拍同行者自然反應、找路、等待、點餐、笑場、突然改行程等片段。這些通常會成為最有旅行記憶的素材。"}], "common": ["每間飯店：門口 → 房號 → 開門 → 房間 → 窗外", "每餐：店外 → 菜單 → 上桌 → 特寫 → 第一口 → 評價", "每次搭車：站名 → 車票 → 進站 → 上車 → 窗外 → 抵達", "每個城市：白天街景＋夜晚街景＋招牌＋便利商店＋腳步", "每天至少一次 10-30 秒真實心得", "每晚確認電量、儲存空間、素材備份"], "intro": "這不是逐字稿，而是現場拍攝提示。每到一站先拍環境，再拍人物與細節，最後補一段真實反應。每個空鏡盡量保持 5-10 秒；說話前後各留約 2 秒，後製比較好剪。", "filmOpening": "先用 8-12 秒快速剪輯：高雄機場 → 玉手箱 → 指宿砂浴 → 櫻島渡輪 → 霧島 → 福岡屋台 → 唐戶市場 →皿倉山夜景 → 回程。「這次我們從高雄出發，要去九州玩 9 天 8 夜。這趟會一路玩鹿兒島、指宿、櫻島、霧島，再回到福岡。這次就把我們真正旅行的樣子完整記錄下來。出發！」", "questions": "不知道要說什麼時，可以問彼此：『目前最喜歡哪一站？』『這個你給幾分？』『跟想像中一樣嗎？』『今天最意外的是什麼？』『如果下次再來，你還會來嗎？』", "finalLine": "「這就是我們的九州 9 天 8夜。旅行結束了，但把它拍下來之後，以後想念這段旅程的時候，我們還可以再回來一次。」"};
let current=0, saved={};try{saved=JSON.parse(localStorage.getItem('kyushu-journal-v1')||'{}')||{}}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortTitles=['出發・鹿兒島','鹿兒島市區','指宿一日遊','櫻島自駕','霧島自駕','移動・福岡','門司港・夜景','福岡市區','回程日'];
function row(text,key,timed=false){let body=esc(text);if(timed){body=body.replace(/^(\d{1,2}:\d{2}(?:\s*[-→]\s*\d{1,2}:\d{2})?)\s*/, '<strong class="time">$1</strong>');body=body.replace(/^(沖繩團|滯留組)：/,'<strong class="group-label">$1</strong><br>')}return `<label class="checkrow"><input type="checkbox" data-key="${key}" ${saved[key]?'checked':''}><span>${body}</span></label>`}
function render(){const d=trip.days[current];document.getElementById('days').innerHTML=trip.days.map((x,i)=>`<button class="daybtn ${i===current?'active':''}" data-day="${i}" ${i===current?'aria-current="date"':''} aria-label="第 ${i+1} 天 ${x.date} ${esc(x.title)}"><b>${String(i+1).padStart(2,'0')}</b><span><small>DAY ${i+1}　/　${x.date}</small>${shortTitles[i]}</span></button>`).join('');document.getElementById('main').innerHTML=`<section class="day-head" data-number="${String(current+1).padStart(2,'0')}"><div class="kicker">DAY ${String(current+1).padStart(2,'0')}　/　${d.date}</div><h2>${esc(d.title)}</h2><div class="day-meta">${d.tag}　・　${d.itinerary.length} 項行程　・　${d.shots.length} 組必拍畫面</div><div class="progress-line"><span>今日行程進度</span><span id="progress" aria-live="polite"></span></div><div class="meter"><div id="bar"></div></div></section><div class="content-grid"><section class="card"><h3>今天做什麼 <small>ITINERARY</small></h3>${d.itinerary.map((t,i)=>row(t,`${current}-plan-${i}`,true)).join('')}</section><section class="card"><h3>把這些拍下來 <small>SHOT LIST</small></h3>${d.shots.map((t,i)=>row(t,`${current}-shot-${i}`)).join('')}</section></div><section class="card quote-card"><details open><summary>今天的 Vlog 口白</summary><h4>OPENING / 開場</h4><blockquote>${esc(d.opening)}</blockquote><h4>ENDING / 收尾</h4><blockquote>${esc(d.closing)}</blockquote></details></section><p class="reminder">現場提醒 / ${esc(d.reminder)}</p><div class="bottom-nav"><button id="prev" ${current===0?'disabled':''}>← 前一天</button><button id="next" ${current===8?'disabled':''}>後一天 →</button></div><section class="card shared"><details><summary>每天都用得上的拍攝清單</summary><p>${esc(trip.intro)}</p>${trip.common.map((t,i)=>row(t,`${current}-common-${i}`)).join('')}<h4>沒有靈感時，問問彼此</h4><p>${esc(trip.questions)}</p></details></section><section class="card shared"><details><summary>整支影片的片頭與最後一句</summary><h4>全片片頭建議</h4><p>${esc(trip.filmOpening)}</p><h4>最後一句</h4><blockquote>${esc(trip.finalLine)}</blockquote></details></section><button class="print" id="print">列印當日行程 ↗</button><p class="foot">依提供的 10/5–10/13 行程腳本整理；時間保留原稿，未列時間的項目依原順序呈現。<br>DAY 3「黃金鳥居」依同頁腳本整理；DAY 4 神社名稱待確認。此頁未查核即時營業與交通資訊。</p>`;updateProgress()}
function updateProgress(){const total=trip.days[current].itinerary.length;const done=trip.days[current].itinerary.filter((_,i)=>saved[`${current}-plan-${i}`]).length;document.getElementById('progress').textContent=`${done} / ${total} 已完成`;document.getElementById('bar').style.width=`${done/total*100}%`}
function selectDay(n){current=Math.max(0,Math.min(8,n));history.replaceState(null,'',`#day-${current+1}`);render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(b)selectDay(Number(b.dataset.day));if(e.target.id==='prev')selectDay(current-1);if(e.target.id==='next')selectDay(current+1);if(e.target.id==='print')window.print()});
document.addEventListener('change',e=>{if(!e.target.matches('[data-key]'))return;saved[e.target.dataset.key]=e.target.checked;try{localStorage.setItem('kyushu-journal-v1',JSON.stringify(saved))}catch(err){document.getElementById('save-note').textContent='此瀏覽器無法儲存，勾選僅保留於本次開啟期間。'}updateProgress()});
function fromHash(){const m=location.hash.match(/^#day-([1-9])$/);current=m?Number(m[1])-1:0;render()}window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
